name: Template init

on:
  push:

permissions:
  contents: write

jobs:
  init:
    if: |
      github.event.repository.is_template == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Customize README and package.json
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESCRIPTION: ${{ github.event.repository.description }}
        run: node scripts/template-init.js

      - name: Commit changes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md package.json
          git rm .github/workflows/template-init.yml

          if git diff --cached --quiet; then
            echo "Nothing to commit — exiting."
            exit 0
          fi

          git commit -m "Customize README for this project [skip ci]"
          git push
